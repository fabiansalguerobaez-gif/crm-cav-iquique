  if (!SHEET_WEBHOOK_URL) return; // sin URL configurada, no hace nada
  try {
    fetch(SHEET_WEBHOOK_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).catch(() => {}); // si no hay internet o falla, no interrumpe el flujo de venta
  } catch (e) {
    // silencioso: el registro nunca debe bloquear el envío al cliente
  }
}
