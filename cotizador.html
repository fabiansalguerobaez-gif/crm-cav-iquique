etter-spacing: 0.4px; }\n  .phase-sublabel { font-size: 11px; color: var(--muted); text-align: center; font-weight: 500; }\n  .phase-body { padding: 0 16px 16px; }\n  .phase-quote { background: var(--bg); border-left: 3px solid var(--green); border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: 12px; color: var(--text); line-height: 1.55; font-style: italic; font-weight: 500; display: block; }\n  .phase-card:nth-child(1) .phase-num { background: var(--blue); }\n  .phase-card:nth-child(1) { border-color: var(--blue); }\n  .phase-card:nth-child(2) .phase-num { background: var(--blue-mid); }\n  .phase-card:nth-child(3) .phase-num { background: var(--yellow); color: var(--blue-dk); }\n  .phase-card:nth-child(4) .phase-num { background: var(--green); }\n  .phase-card:nth-child(4) { border-color: var(--green); }\n\n  /* SCRIPT PANEL */\n  .script-panel { background: var(--card); border-radius: 16px; border: 1.5px solid var(--border); margin-top: 20px; overflow: hidden; }\n  .script-tabs { display: flex; border-bottom: 2px solid var(--border); background: var(--bg); overflow-x: auto; }\n  .script-tab { padding: 12px 20px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }\n  .script-tab:hover { color: var(--green-dk); }\n  .script-tab.active { color: var(--green-dk); border-bottom-color: var(--green); background: white; }\n  .script-content { padding: 28px 32px; display: none; }\n  .script-content.active { display: block; }\n  .script-content h3 { font-size: 17px; font-weight: 800; color: var(--blue-dk); margin-bottom: 8px; }\n  .tip-text { font-size: 12.5px; color: var(--muted); font-weight: 500; margin-bottom: 20px; display: flex; align-items: center; gap: 6px; }\n  .script-block { background: var(--bg); border-left: 4px solid var(--green); border-radius: 0 10px 10px 0; padding: 16px 18px; font-size: 14px; line-height: 1.7; color: var(--text); font-style: italic; margin-bottom: 14px; position: relative; }\n  .script-block::before { content: '\"'; position: absolute; top: -6px; left: 12px; font-size: 40px; color: var(--green); opacity: 0.25; font-style: normal; font-family: Georgia, serif; }\n  .script-block.blue { border-left-color: var(--blue); }\n  .script-block.yellow { border-left-color: var(--yellow); background: #FFFBEE; }\n  .script-block.orange { border-left-color: var(--orange); background: #FFF4EE; }\n  .script-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 8px; margin-top: 4px; display: flex; align-items: center; gap: 5px; }\n\n  /* VARIANTS BOX */\n  .variants-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0; }\n  .variant-card { border-radius: 12px; border: 2px solid var(--border); padding: 14px 16px; text-align: center; }\n  .variant-card.v5g { border-color: var(--blue); background: #EBF7FF; }\n  .variant-card.vgb { border-color: var(--green); background: #F0FFF4; }\n  .variant-card h4 { font-size: 15px; font-weight: 800; margin-bottom: 4px; }\n  .variant-card.v5g h4 { color: var(--blue-mid); }\n  .variant-card.vgb h4 { color: var(--green-dk); }\n  .variant-card p { font-size: 12px; color: var(--muted); font-weight: 500; line-height: 1.45; }\n\n  /* OBJECTIONS */\n  .objections-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }\n  .obj-card { border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.2s; }\n  .obj-card:hover { border-color: var(--yellow); }\n  .obj-card.open { border-color: var(--yellow); }\n  .obj-header { padding: 14px 16px; background: white; display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n  .obj-q { font-size: 13px; font-weight: 600; color: var(--text); display: flex; align-items: flex-start; gap: 8px; }\n  .obj-q .q-icon { width: 22px; height: 22px; min-width: 22px; background: var(--yellow); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--blue-dk); }\n  .obj-toggle { font-size: 18px; color: var(--muted); transition: transform 0.2s; min-width: 20px; text-align: center; }\n  .obj-card.open .obj-toggle { transform: rotate(90deg); color: var(--yellow); }\n  .obj-answer { display: none; padding: 14px 16px; background: #FFFBEE; border-top: 1px solid #FFE57A; font-size: 13px; line-height: 1.65; color: var(--text); font-style: italic; }\n  .obj-card.open .obj-answer { display: block; }\n\n  /* TIPS */\n  .tips-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }\n  .tip-item { background: white; border-radius: 10px; border: 1.5px solid var(--border); padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; }\n  .tip-moment { background: var(--blue-dk); color: white; border-radius: 8px; padding: 6px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; min-width: 95px; text-align: center; line-height: 1.3; }\n  .tip-key { font-size: 13px; color: var(--text); font-weight: 500; line-height: 1.5; }\n\n  /* LINEAS ADICIONALES BOX */\n  .lineas-box { background: linear-gradient(135deg, var(--blue-dk), var(--blue-mid)); border-radius: 14px; padding: 18px 22px; color: white; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin: 16px 0; }\n  .lineas-price { font-size: 32px; font-weight: 900; }\n  .lineas-detail { font-size: 13px; opacity: 0.8; margin-top: 2px; }\n  .lineas-desc { flex: 1; font-size: 13px; line-height: 1.55; opacity: 0.9; }\n\n  /* BUTTONS */\n  .btn-download { display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(135deg, var(--green-dk), var(--green)); color: white; border: none; border-radius: 12px; padding: 14px 28px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 6px 20px rgba(120,190,32,0.35); font-family: inherit; }\n  .btn-download:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(120,190,32,0.45); }\n  .btn-download.blue { background: linear-gradient(135deg, var(--blue), var(--blue-mid)); box-shadow: 0 6px 20px rgba(1,157,244,0.35); }\n\n  /* FOOTER */\n  .footer { background: var(--blue-dk); padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }\n  .footer p { font-size: 12px; color: rgba(255,255,255,0.5); }\n  .footer strong { color: rgba(255,255,255,0.85); }\n\n  @media print {\n    body { background: white; }\n    .obj-answer { display: block !important; }\n    .btn-download { display: none; }\n    .script-content { display: block !important; }\n    .script-tabs { display: none; }\n    .alert-banner, .footer, .header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n  }\n  @media (max-width: 780px) {\n    .phases-grid { grid-template-columns: repeat(2, 1fr); }\n    .header-inner { flex-direction: column; }\n    .objections-grid, .variants-row { grid-template-columns: 1fr; }\n    .tips-grid { grid-template-columns: 1fr; }\n    .main { padding: 20px 14px 40px; }\n    .phases-grid::before { display: none; }\n    .script-content { padding: 18px 16px; }\n    .plan-strip, .alert-banner { padding: 12px 16px; }\n  }\n<\/style>\n<\/head>\n<body>\n<div id=\"back-nav-bar\" style=\"position:fixed;top:0;left:0;right:0;z-index:999999;background:linear-gradient(90deg,#001233 0%,#002a6e 100%);padding:10px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 3px 18px rgba(0,0,0,0.55);font-family:'Poppins','Segoe UI',sans-serif;\">\n  <button onclick=\"parent.postMessage('back-to-carrito','*')\" style=\"background:linear-gradient(90deg,#ec0a8c,#c0076e);color:#fff;border:none;padding:9px 20px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;\">&#8592; Volver al Carrito<\/button>\n  <span style=\"color:rgba(255,255,255,0.55);font-size:12px;font-weight:600;\">&#128203; Script de Ventas &middot; Movistar Chile<\/span>\n<\/div>\n<div style=\"height:54px;\"><\/div>\n\n<!-- HEADER -->\n<div class=\"header\">\n  <div class=\"header-inner\">\n    <div class=\"logo-area\">\n      <div class=\"logo-mark\">M<\/div>\n      <div class=\"logo-text\">\n        <h1>Movistar Chile — Totalización<\/h1>\n        <p>Script Ejecutivo · Sucursales III Región de Atacama · Clientes Hogar<\/p>\n      <\/div>\n    <\/div>\n    <div class=\"header-badges\">\n      <div style=\"position:relative; display:inline-block;\">\n        <div class=\"plan-badge\">\n          <div class=\"badge-label\">Precio Promo<\/div>\n          <div class=\"badge-price\">$7.990<\/div>\n          <div class=\"badge-sub\">50% dcto · 6 meses<\/div>\n        <\/div>\n        <div class=\"dcto-pill\">50% dcto<\/div>\n      <\/div>\n      <div class=\"plan-badge alt\">\n        <div class=\"badge-label\">Líneas adicionales<\/div>\n        <div class=\"badge-price\">$4.990<\/div>\n        <div class=\"badge-sub\">por 6 meses c/u<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- ALERT BANNER -->\n<div class=\"alert-banner\">\n  <span class=\"alert-icon\">⚠️<\/span>\n  <span><strong>Importante para el ejecutivo:<\/strong> Precio promo variable — confirme el valor vigente cada semana antes de iniciar la gestión.<\/span>\n<\/div>\n\n<!-- PLAN STRIP -->\n<div class=\"plan-strip\">\n  <span class=\"plan-strip-label\">Plan incluye:<\/span>\n  <span class=\"pill\"><span class=\"pill-icon\">📱<\/span>Multimedia Libre 450 · Cod_4FX<\/span>\n  <span class=\"pill\"><span class=\"pill-icon\">📶<\/span>450 GB (umbral navegación)<\/span>\n  <span class=\"pill\"><span class=\"pill-icon\">📞<\/span>Minutos Libres<\/span>\n  <span class=\"pill\"><span class=\"pill-icon\">💬<\/span>500 SMS<\/span>\n  <span class=\"pill\" style=\"border-color:var(--blue);color:var(--blue-mid);\"><span class=\"pill-icon\">5G<\/span>5G Libre<\/span>\n  <span class=\"pill\" style=\"border-color:var(--green);color:var(--green-dk);\"><span class=\"pill-icon\">🌐<\/span>GB Libres<\/span>\n  <span class=\"pill\" style=\"border-color:var(--orange);color:var(--orange);\"><span class=\"pill-icon\">📦<\/span>¡Ofrécelo con equipo!<\/span>\n<\/div>\n\n<!-- MAIN -->\n<div class=\"main\">\n\n  <!-- CONTEXT BOX -->\n  <div class=\"context-box\">\n    <div class=\"context-icon\">🏠<\/div>\n    <div class=\"context-text\">\n      <h4>¿Qué es la Totalización?<\/h4>\n      <p>Usted está llamando a clientes que <strong>ya tienen servicios Movistar Hogar<\/strong> (internet, TV, telefonía fija). El objetivo es que contraten una línea móvil con nosotros o <strong>se porten desde otra compañía<\/strong>, aprovechando un precio preferente reservado para clientes hogar. El gancho principal es la <strong>confianza ya instalada<\/strong> con Movistar y el ahorro frente a lo que pagan hoy en otra compañía.<\/p>\n    <\/div>\n  <\/div>\n\n  <!-- FLUJO -->\n  <div class=\"section-title\">\n    <h2>📋 Flujo de la llamada<\/h2>\n  <\/div>\n  <div class=\"phases-grid\">\n    <div class=\"phase-card\" onclick=\"selectPhase(this,'apertura')\">\n      <div class=\"phase-header\">\n        <div class=\"phase-num\">1<\/div>\n        <div class=\"phase-icon\">🏠<\/div>\n        <div class=\"phase-label\">Apertura<\/div>\n        <div class=\"phase-sublabel\">Vínculo hogar<\/div>\n      <\/div>\n      <div class=\"phase-body\">\n        <div class=\"phase-quote\">\"Le llamo porque usted ya es cliente Movistar en su hogar y quiero contarle un beneficio exclusivo al que tiene acceso por esa razón.\"<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"phase-card\" onclick=\"selectPhase(this,'propuesta')\">\n      <div class=\"phase-header\">\n        <div class=\"phase-num\">2<\/div>\n        <div class=\"phase-icon\">💬<\/div>\n        <div class=\"phase-label\">Propuesta<\/div>\n        <div class=\"phase-sublabel\">El precio preferente<\/div>\n      <\/div>\n      <div class=\"phase-body\">\n        <div class=\"phase-quote\">\"El plan vale $15.990, pero por ser cliente hogar nuestro usted lo tiene a $7.990 por 6 meses. La mitad del precio.\"<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"phase-card\" onclick=\"selectPhase(this,'objeciones')\">\n      <div class=\"phase-header\">\n        <div class=\"phase-num\">3<\/div>\n        <div class=\"phase-icon\">🛡️<\/div>\n        <div class=\"phase-label\">Objeciones<\/div>\n        <div class=\"phase-sublabel\">Manejo y rebote<\/div>\n      <\/div>\n      <div class=\"phase-body\">\n        <div class=\"phase-quote\">\"Lo entiendo. Pero la portabilidad es gratuita y su número queda igual. Solo cambia la compañía y el precio que paga al mes.\"<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"phase-card\" onclick=\"selectPhase(this,'cierre')\">\n      <div class=\"phase-header\">\n        <div class=\"phase-num\">4<\/div>\n        <div class=\"phase-icon\">✅<\/div>\n        <div class=\"phase-label\">Cierre<\/div>\n        <div class=\"phase-sublabel\">Confirma y activa<\/div>\n      <\/div>\n      <div class=\"phase-body\">\n        <div class=\"phase-quote\">\"¿Lo dejamos listo hoy? Misma compañía de confianza que ya tiene en su hogar, mismo respaldo, y a mitad de precio por 6 meses.\"<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- SCRIPT PANEL -->\n  <div class=\"section-title\" style=\"margin-top:28px;\">\n    <h2>🎙️ Scripts completos por fase<\/h2>\n  <\/div>\n  <div class=\"script-panel\">\n    <div class=\"script-tabs\">\n      <div class=\"script-tab active\" data-tab=\"apertura\" onclick=\"switchTab('apertura')\">🏠 Apertura<\/div>\n      <div class=\"script-tab\" data-tab=\"propuesta\" onclick=\"switchTab('propuesta')\">💬 Propuesta de Valor<\/div>\n      <div class=\"script-tab\" data-tab=\"variantes\" onclick=\"switchTab('variantes')\">📶 Variantes del Plan<\/div>\n      <div class=\"script-tab\" data-tab=\"objeciones\" onclick=\"switchTab('objeciones')\">🛡️ Objeciones<\/div>\n      <div class=\"script-tab\" data-tab=\"cierre\" onclick=\"switchTab('cierre')\">✅ Cierre<\/div>\n    <\/div>\n\n    <!-- APERTURA -->\n    <div class=\"script-content active\" id=\"tab-apertura\">\n      <h3>🏠 Script de Apertura — El vínculo hogar es su diferenciador<\/h3>\n      <p class=\"tip-text\">💡 No se presente como una venta fría. Usted no llama a un desconocido — llama a un cliente que ya confía en Movistar. Úselo desde el primer segundo.<\/p>\n\n      <div class=\"script-label\">🟢 Saludo inicial — Activar el vínculo<\/div>\n      <div class=\"script-block\">\n        \"Hola, buenos [días/tardes], ¿me comunico con el señor / la señora [Nombre]? Muy bien. Le habla [Su nombre] de Movistar Chile. Le llamo porque usted es cliente nuestro en su hogar y hemos identificado un beneficio exclusivo al que tiene acceso por esa razón. ¿Tiene un momento para que se lo cuente?\"\n      <\/div>\n\n      <div class=\"script-label\">🔵 Si dice sí → Continúe de inmediato con el contexto:<\/div>\n      <div class=\"script-block\">\n        \"Mire, lo que pasa es que en Movistar tenemos un programa especial para clientes hogar: cuando usted suma su línea móvil a los servicios que ya tiene con nosotros, accede a un precio preferente que no está disponible para el público en general. Y eso es exactamente lo que quiero ofrecerle hoy.\"\n      <\/div>\n\n      <div class=\"script-label\">⚠️ Si dice que está ocupado:<\/div>\n      <div class=\"script-block yellow\">\n        \"Por supuesto, lo respeto. ¿A qué hora le viene mejor que le llame de vuelta? Le puedo reservar el beneficio, pero tiene disponibilidad limitada y no quisiera que se lo perdiera siendo usted ya cliente nuestro.\"\n      <\/div>\n    <\/div>\n\n    <!-- PROPUESTA -->\n    <div class=\"script-content\" id=\"tab-propuesta\">\n      <h3>💬 Propuesta de Valor — El precio preferente hogar<\/h3>\n      <p class=\"tip-text\">💡 Ancle siempre al precio que paga hoy en su compañía móvil actual. El 50% de descuento es el argumento más fuerte — no lo guarde para el final.<\/p>\n\n      <div class=\"script-label\">🟢 Presentación del plan<\/div>\n      <div class=\"script-block\">\n        \"El plan que le tengo se llama Multimedia Libre 450. Incluye minutos libres para llamar, 500 mensajes de texto y 450 GB de navegación. El precio normal de este plan es $15.990 al mes, pero por ser cliente hogar Movistar, usted lo tiene a <strong>$7.990 por 6 meses<\/strong>. Eso es exactamente la mitad del precio.\"\n      <\/div>\n\n      <div class=\"script-label\">📊 Anclaje vs. lo que paga hoy — argumento clave<\/div>\n      <div class=\"script-block\">\n        \"Le pregunto: ¿cuánto está pagando actualmente por su plan móvil? [escuche y anote]. Entonces con este plan usted tendría más GB, minutos libres y pagaría $7.990 en vez de [lo que paga]. Y si después del período promocional quiere evaluarlo, tiene 6 meses para decidir con toda la información.\"\n      <\/div>\n\n      <div class=\"script-label\">📦 Oferta con equipo — use cuando el cliente no tiene smartphone reciente<\/div>\n      <div class=\"script-block blue\">\n        \"Y si le interesa, el plan también se puede combinar con un equipo nuevo. Tenemos opciones para que lo pague en cuotas junto a su plan, sin necesidad de desembolsar todo de una vez. ¿Le gustaría que le cuente las alternativas disponibles?\"\n      <\/div>\n\n      <!-- LINEAS ADICIONALES -->\n      <div class=\"lineas-box\">\n        <div>\n          <div class=\"lineas-price\">$4.990<\/div>\n          <div class=\"lineas-detail\">por línea adicional · 6 meses<\/div>\n        <\/div>\n        <div class=\"lineas-desc\">\n          <strong style=\"font-size:15px;\">¿Tiene más familia en el hogar?<\/strong><br>\n          Cada línea adicional que sume tiene el mismo beneficio: mismo plan, mismo descuento, a solo $4.990 por 6 meses. Ideal para suma de familia completa.\n        <\/div>\n      <\/div>\n\n      <div class=\"script-label\">🟢 Script para líneas adicionales<\/div>\n      <div class=\"script-block\">\n        \"Por cierto, señor/señora [Nombre], si algún familiar suyo también quiere sumarse — su señora, un hijo — cada línea adicional tiene el mismo beneficio a $4.990 al mes por 6 meses. Podría aprovechar y cubrirlos a todos con una sola llamada.\"\n      <\/div>\n    <\/div>\n\n    <!-- VARIANTES -->\n    <div class=\"script-content\" id=\"tab-variantes\">\n      <h3>📶 Variantes del Plan — Cómo explicar 5G Libre vs GB Libres<\/h3>\n      <p class=\"tip-text\">💡 Confirme con el cliente qué tipo de uso tiene antes de presentar la variante. No ofrezca las dos al mismo tiempo — puede generar confusión y perder el cierre.<\/p>\n\n      <div class=\"variants-row\">\n        <div class=\"variant-card v5g\">\n          <h4>📡 5G Libre<\/h4>\n          <p>Para clientes que tienen o quieren un equipo compatible con red 5G. Acceden a la red de mayor velocidad disponible en las zonas con cobertura.<\/p>\n        <\/div>\n        <div class=\"variant-card vgb\">\n          <h4>🌐 GB Libres<\/h4>\n          <p>Para clientes con equipos 4G o que priorizan la cantidad de datos disponibles. 450 GB de umbral de navegación incluidos en el plan.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"script-label\">🟢 Script para cliente con equipo moderno (5G)<\/div>\n      <div class=\"script-block\">\n        \"Si su equipo es compatible con red 5G, le recomiendo la variante 5G Libre. Así aprovecha la red más rápida disponible en su zona. Al mismo precio de $7.990, sin costo adicional.\"\n      <\/div>\n\n      <div class=\"script-label\">🟢 Script para cliente con equipo 4G o sin saber<\/div>\n      <div class=\"script-block\">\n        \"Si no está seguro de la tecnología de su equipo, no se preocupe. La variante GB Libres le da 450 GB de navegación y funciona perfectamente con cualquier smartphone moderno. Es la opción más completa en cuanto a datos disponibles.\"\n      <\/div>\n\n      <div class=\"script-label\">⚠️ Recordatorio importante — Roaming<\/div>\n      <div class=\"script-block yellow\">\n        \"Le menciono que este plan no incluye beneficio de roaming internacional. Si usted viaja frecuentemente al extranjero y necesita usar el teléfono allá, habría que revisar una opción complementaria. ¿Es ese su caso?\"\n      <\/div>\n    <\/div>\n\n    <!-- OBJECIONES -->\n    <div class=\"script-content\" id=\"tab-objeciones\">\n      <h3>🛡️ Manejo de Objeciones — Las más frecuentes en Totalización<\/h3>\n      <p class=\"tip-text\">💡 En totalización el cliente ya confía en Movistar para su hogar. Úselo como argumento en cada rebote: la confianza ya está ganada.<\/p>\n      <div class=\"objections-grid\" style=\"margin-top:8px;\">\n\n        <div class=\"obj-card open\" onclick=\"toggleObj(this)\">\n          <div class=\"obj-header\">\n            <div class=\"obj-q\"><span class=\"q-icon\">?<\/span>\"Ya tengo móvil con otra compañía y estoy conforme\"<\/div>\n            <div class=\"obj-toggle\">›<\/div>\n          <\/div>\n          <div class=\"obj-answer\">\n            \"Lo entiendo perfectamente, señor/señora [Nombre]. Lo que le propongo no es que cambie por cambiar, sino que evalúe si lo que paga hoy es realmente conveniente comparado con este precio. ¿Cuánto paga actualmente? [escuche]. Con $7.990 usted tiene minutos libres y 450 GB. Si hoy está pagando más por menos, el cambio se justifica solo. Y su número queda exactamente igual con la portabilidad.\"\n          <\/div>\n        <\/div>\n\n        <div class=\"obj-card\" onclick=\"toggleObj(this)\">\n          <div class=\"obj-header\">\n            <div class=\"obj-q\"><span class=\"q-icon\">?<\/span>\"¿Por qué me dan descuento si ya soy cliente?\"<\/div>\n            <div class=\"obj-toggle\">›<\/div>\n          <\/div>\n          <div class=\"obj-answer\">\n            \"Muy buena pregunta. Este precio preferente existe precisamente porq
